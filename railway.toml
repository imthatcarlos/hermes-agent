[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Hermes OpenAI-compatible gateway. Bearer-token auth via API_SERVER_KEY env.
# Exposed as a TCP proxy because the gateway speaks raw HTTP without HTTPS
# termination expectations — TCP proxy gives a stable host:port endpoint.
[[deploy.tcpProxy]]
applicationPort = 8642

# Hermes dashboard runs on 9119 internally. Generate an HTTP domain in the
# Railway UI (Settings -> Networking -> Generate Domain), pointing at port
# 9119, to expose it as https://<service>-production.up.railway.app.
# (No tcpProxy here — HTTP routing handled by Railway's built-in proxy.)

# Persistent state — Hermes writes config, sessions, skills, memories under here;
# Sherwood writes ~/.sherwood/config.json under hermes user's HOME (/opt/data).
[[deploy.volumes]]
mountPath = "/opt/data"
name = "hermes-state"
