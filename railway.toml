[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Hermes dashboard. Public-but-unguessable URL; auth is via API_SERVER_KEY for
# the gateway and via Hermes' own session cookie for the dashboard. If the
# Railway URL leaks, add Caddy basic-auth in front of 127.0.0.1:9119.
[[deploy.tcpProxy]]
applicationPort = 9119

# Hermes OpenAI-compatible gateway. Bearer-token auth via API_SERVER_KEY env.
[[deploy.tcpProxy]]
applicationPort = 8642

# Persistent state — Hermes writes config, sessions, skills, memories under here;
# Sherwood writes ~/.sherwood/config.json under hermes user's HOME (/opt/data).
[[deploy.volumes]]
mountPath = "/opt/data"
name = "hermes-state"
