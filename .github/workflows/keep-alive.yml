name: Keep Sprite Alive

on:
  schedule:
    # Every minute
    - cron: '* * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Install Sprite CLI
        run: curl -fsSL https://sprites.dev/install.sh | bash

      - name: Authenticate Sprite CLI
        env:
          SPRITE_AUTH_TOKEN: ${{ secrets.SPRITE_AUTH_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          sprite auth setup --token "$SPRITE_AUTH_TOKEN"

      - name: Keep alive loop (ping every 25s for ~1 minute)
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          for i in 1 2 3; do
            echo "=== Ping $i at $(date) ==="

            # Check if gateway is running
            GATEWAY_RUNNING=$(sprite exec -s clawd -- pgrep -f clawdbot-gateway 2>/dev/null || echo "")

            if [ -z "$GATEWAY_RUNNING" ]; then
              echo "Gateway not running, starting it..."
              sprite exec -s clawd -- rm -f ~/.clawdbot/gateway.*.lock 2>/dev/null || true
              sprite exec -s clawd -tty -- npx clawdbot gateway --port 18789 &
              sleep 5
              echo "Gateway started"
            else
              echo "Gateway running (PID: $GATEWAY_RUNNING)"
            fi

            # Sleep 25s between pings (except after last one)
            if [ $i -lt 3 ]; then
              sleep 25
            fi
          done

          echo "=== Keepalive complete ==="
